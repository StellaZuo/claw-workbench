<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<title>里里工作台</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#0f1419; --card:#1a212b; --card2:#222c38; --txt:#e8edf2; --sub:#9aa7b4;
  --accent:#f0b43c; --green:#3fd07f; --blue:#4aa8ff; --purple:#b48cff; --red:#ff6b6b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding:env(safe-area-inset-top) 16px calc(16px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;}
header{padding:20px 0 12px;display:flex;align-items:baseline;justify-content:space-between;}
header h1{font-size:22px;font-weight:700;}
header .date{color:var(--sub);font-size:13px;}
.section-title{font-size:13px;color:var(--sub);margin:18px 4px 8px;letter-spacing:.5px;}
.overview{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.ov-card{background:var(--card);border-radius:14px;padding:14px;}
.ov-card .num{font-size:24px;font-weight:700;color:var(--accent);}
.ov-card .label{font-size:12px;color:var(--sub);margin-top:2px;}
.space{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;}
.space-head{display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
.space-name{font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px;}
.dot{width:10px;height:10px;border-radius:50%;}
.space-sub{font-size:12px;color:var(--sub);margin-top:2px;}
.chev{color:var(--sub);transition:transform .2s;font-size:18px;line-height:1;}
.space.open .chev{transform:rotate(90deg);}
.space-body{max-height:0;overflow:hidden;transition:max-height .3s;}
.space.open .space-body{max-height:640px;margin-top:12px;}
.chip{display:inline-block;background:var(--card2);border-radius:8px;padding:4px 10px;font-size:12px;margin:3px 4px 3px 0;color:var(--sub);}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid #ffffff12;}
.kv:last-child{border-bottom:none;}
.kv .v{color:var(--txt);}
.empty{color:var(--sub);font-size:13px;font-style:italic;}
footer{text-align:center;color:var(--sub);font-size:11px;padding:16px 0 8px;}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;}
.badge.ok{background:#3fd07f22;color:var(--green);}
.badge.no{background:#ff6b6b22;color:var(--red);}
</style>
</head>
<body>
<header><h1>里里工作台</h1><span class="date" id="date"></span></header>

<div class="section-title">今日概览</div>
<div class="overview" id="overview"></div>

<div class="section-title">空间</div>
<div id="spaces"></div>

<footer id="footer"></footer>

<script src="data.js"></script>
<script>
const D = window.WB_DATA;
document.getElementById('date').textContent = D.date;

const w = D.spaces.work, f = D.spaces.fatloss, s = D.spaces.study, r = D.spaces.review, l = D.spaces.life;

const ovCards = [
  {num: w.clientCount, label:'客户台账'},
  {num: (f.latest && f.latest.weight ? f.latest.weight+'斤' : '—'), label:'今日体重'},
  {num: s.total, label:'学习笔记'},
  {num: (r.weekly || r.daily || '待复盘'), label:'最近复盘'},
];
document.getElementById('overview').innerHTML = ovCards.map(c=>
  `<div class="ov-card"><div class="num">${c.num}</div><div class="label">${c.label}</div></div>`).join('');

const spaces = [
  {name:'工作 GEO', color:'var(--accent)', sub:`${w.clientCount} 个客户台账`, body:`
     <div>${Object.entries(w.statusBreakdown).map(([k,v])=>`<span class="chip">${k} ${v}</span>`).join('')||'<span class="empty">暂无状态分布</span>'}</div>
     <div style="margin-top:8px;font-size:12px;color:var(--sub)">最近客户：</div>
     <div>${w.recentClients.slice(0,8).map(n=>`<span class="chip">${n}</span>`).join('')||'<span class="empty">—</span>'}</div>`},
  {name:'减脂', color:'var(--green)', sub:`连续打卡 ${f.streak} 天`, body: f.latest?`
     <div class="kv"><span>日期</span><span class="v">${f.latest.file}</span></div>
     <div class="kv"><span>体重</span><span class="v">${f.latest.weight||'—'} 斤</span></div>
     <div class="kv"><span>饮水</span><span class="v">${f.latest.water||'—'}</span></div>
     <div class="kv"><span>暴食(今日)</span><span class="v">${f.latest.no_binge?'否 · 已抗住':'是'}</span></div>`:'<span class="empty">暂无打卡</span>'},
  {name:'学习', color:'var(--blue)', sub:`${s.total} 篇笔记`, body:`
     <div>${Object.entries(s.byCat).map(([k,v])=>`<span class="chip">${k} ${v}</span>`).join('')||'<span class="empty">暂无</span>'}</div>`},
  {name:'复盘', color:'var(--purple)', sub: r.weekly?`周复盘 ${r.weekly}`:'待复盘', body:`
     <div class="kv"><span>日复盘</span><span class="v">${r.daily||'—'}</span></div>
     <div class="kv"><span>周复盘</span><span class="v">${r.weekly||'—'}</span></div>
     <div class="kv"><span>月复盘</span><span class="v">${r.monthly||'—'}</span></div>`},
  {name:'生活', color:'var(--red)', sub: l.hasData?'已记录':'待建设', body: l.hasData?`
     <div>${l.recent.map(n=>`<span class="chip">${n}</span>`).join('')}</div>`:'<span class="empty">生活空间已建，待左星逐步填充（日程 / 记账 / 兴趣 / 社交）</span>'},
];
const sc = document.getElementById('spaces');
sc.innerHTML = spaces.map(sp=>`
  <div class="space">
    <div class="space-head">
      <div>
        <div class="space-name"><span class="dot" style="background:${sp.color}"></span>${sp.name}</div>
        <div class="space-sub">${sp.sub}</div>
      </div>
      <span class="chev">›</span>
    </div>
    <div class="space-body">${sp.body}</div>
  </div>`).join('');
sc.querySelectorAll('.space').forEach(el=>{
  el.querySelector('.space-head').addEventListener('click',()=>el.classList.toggle('open'));
});

const mem = D.memory.todayExists;
document.getElementById('footer').innerHTML =
  `记忆层 ${mem?'<span class="badge ok">今日已记</span>':'<span class="badge no">今日未记</span>'} · 更新于 ${D.generated}`;

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
